name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@259f7cac3f785edafec6ac48c6d490ab5dd87e8d
    with:
      tooling_ref: 259f7cac3f785edafec6ac48c6d490ab5dd87e8d
  drift:
    if: github.event_name == 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@47349b9f62ff72edef167edd75e3ee118b023287
    with:
      tooling_ref: 47349b9f62ff72edef167edd75e3ee118b023287
      drift: true
