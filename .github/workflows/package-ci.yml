name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@6832a5542e31e6c5a19b5afa021690b1d455a22f
    with:
      tooling_ref: 6832a5542e31e6c5a19b5afa021690b1d455a22f
      paired_scan: true
  drift:
    if: github.event_name == 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@47349b9f62ff72edef167edd75e3ee118b023287
    with:
      tooling_ref: 47349b9f62ff72edef167edd75e3ee118b023287
      drift: true
