name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@a24b5dca905482e47fecc8e84468af0c55c8609c
    with:
      tooling_ref: a24b5dca905482e47fecc8e84468af0c55c8609c
  drift:
    if: github.event_name == 'schedule'
    uses: getpatched/actions/.github/workflows/package-ci.yml@a24b5dca905482e47fecc8e84468af0c55c8609c
    with:
      tooling_ref: a24b5dca905482e47fecc8e84468af0c55c8609c
      drift: true
