name: Package CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      drift:
        description: Check source and dependency drift
        type: boolean
        default: false
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'schedule' && !inputs.drift
    uses: getpatched/actions/.github/workflows/package-ci.yml@67bb1a2e9f477b62c13b9e3fd1fc34951593c473
    with:
      tooling_ref: 67bb1a2e9f477b62c13b9e3fd1fc34951593c473
  drift:
    name: Drift (${{ matrix.branch }})
    if: github.event_name == 'schedule' || inputs.drift
    strategy:
      fail-fast: false
      matrix:
        branch: [main, getpatched/focal, getpatched/jammy]
    uses: getpatched/actions/.github/workflows/package-ci.yml@67bb1a2e9f477b62c13b9e3fd1fc34951593c473
    with:
      tooling_ref: 67bb1a2e9f477b62c13b9e3fd1fc34951593c473
      drift: true
      recipe_ref: refs/heads/${{ matrix.branch }}
